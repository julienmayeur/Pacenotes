<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacenote</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- shared i18n helper: t(), data-i18n, <language-select> (see README "Languages") -->
  <script src="/static/i18n.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="top">
      <div class="brand">
        <span id="client"></span>
        <span id="listen" class="listen idle" title="">
          <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span id="listen-label" class="listen-label"></span>
          <span id="langs" class="langs"></span>
        </span>
      </div>
      <div class="meta">
        <!-- THE display language (labels, questions, follow-ups, missing items): one at a time.
             Not the spoken languages, which are the quiet FR / EN tags of the listening indicator. -->
        <language-select id="ui-switch" bind="ui" compact segmented label="lang.display"
                         data-i18n-attr="title:lang.display"></language-select>
        <!-- the interviewer's details (timings, transcript, coverage by theme, follow-ups asked...): one toggle, d -->
        <button id="details-toggle" class="details-toggle" type="button" aria-pressed="false"
                data-i18n-attr="title:details.toggleTitle"><span data-i18n="details.toggle"></span><kbd>d</kbd></button>
        <span id="sync-dot" class="dot" title=""></span>
      </div>
    </header>

    <div id="alerts" class="alerts" role="alert"></div>

    <main class="stage">
      <!-- ONE panel = the interview thread: past questions (compact, collapsible) above,
           the current card, then the upcoming questions (smaller); it scrolls only when they no longer fit -->
      <section id="interview" class="focus interview">
        <div class="thread-head label small-label" id="history-head"><span data-i18n="thread.title"></span></div>
        <ol id="history" class="history"></ol>

        <article id="current-card" class="current-card">
          <div class="card-ghost" id="card-ghost" aria-hidden="true"></div>
          <div class="card-body" id="card-body">
            <!-- the theme under study: a calm header (the seed question and its own
                 Business > Workflow > Implementation ladder), not the focal point -->
            <!-- the step (phase) the interview is in: a calm title -->
            <div class="card-top">
              <div class="label theme-label">
                <span id="phase-label" class="phase-label"></span>
                <span id="theme-word" data-i18n="focus.theme"></span>
                <span id="current-origin" class="origin"></span>
                <span id="analysing" class="analysing" aria-live="polite"></span>
              </div>
            </div>
            <!-- the theme question, as small context under a follow-up (with none yet it IS the question to ask,
                 shown once, at focal size), and its own Business > Workflow > Implementation ladder -->
            <header id="theme-head" class="theme-head">
              <h2 id="current" class="current"></h2>
              <ol id="ladder" class="ladder" data-i18n-attr="aria-label:focus.ladder"></ol>
            </header>

            <!-- THE focal point: what the interviewee is answering (the follow-up asked; with none yet, the
                 theme question itself). It stays until the answer is over; new follow-ups queue under it -->
            <section id="ask-now" class="ask-now" aria-live="polite">
              <span id="ask-label" class="ask-label"></span>
              <p id="ask-text" class="ask-text"></p>
              <!-- with several attendees: who to address it to (attendees.py) -->
              <p id="ask-to" class="ask-to hidden"></p>
              <!-- what to ask next, queued under it as understanding grows; never in its place -->
              <ol id="ask-next" class="ask-next hidden" aria-live="polite"></ol>
            </section>

            <!-- attached to the question: what we heard so far, then what is still missing -->
            <div class="answer" id="answer">
              <section id="summary-card" class="summary-box" aria-live="polite">
                <div class="block-label"><span data-i18n="focus.summary"></span>
                  <span id="current-pill" class="pill"></span><span id="vague" class="vague"></span></div>
                <p id="summary-text" class="summary-text"></p>
                <p id="thread-empty" class="thread-empty"></p>
              </section>

              <section id="missing-card" class="missing-box" aria-live="polite">
                <div class="missing-head">
                  <span class="missing-title" data-i18n="focus.missing"></span>
                  <span id="missing-rung" class="missing-rung"></span>
                  <span id="missing-usecase" class="missing-usecase"></span>
                  <span id="missing-count" class="missing-count"></span>
                </div>
                <ul id="missing" class="missing-chips"></ul>
                <p id="missing-empty" class="missing-empty"></p>
                <div id="got-row" class="got-row">
                  <span class="got-label" data-i18n="focus.got"></span>
                  <ul id="got" class="got-chips"></ul>
                </div>
              </section>
            </div>

            <!-- the executive lens (lens.py): a talking point about this workflow's manual work; why now stays
                 in the interviewer console -->
            <p id="framing-say" class="ambassador-ask hidden" aria-live="polite">
              <span class="amb-label"><span data-i18n="focus.framingLabel"></span><span id="framing-uc" class="amb-uc"></span></span>
              <span id="framing-text" class="amb-text"></span>
            </p>
            <!-- more questions tied to this workflow: its missing baseline or success metric (lens.py) and an
                 indirect people question (pilots.py); why they are asked stays in the interviewer console -->
            <p id="ambassador-ask" class="ambassador-ask hidden" aria-live="polite">
              <span class="amb-label"><span data-i18n="focus.ambassadorLabel"></span><span id="ambassador-uc" class="amb-uc"></span></span>
              <span id="metric-text" class="amb-text"></span>
              <span id="ambassador-text" class="amb-text"></span>
            </p>
            <!-- what the interviewee could not answer here, and who would know (personas.py): noted for the plan,
                 never pushed -->
            <p id="to-check" class="ambassador-ask to-check hidden" aria-live="polite">
              <span class="amb-label"><span data-i18n="focus.toCheckLabel"></span></span>
              <span id="to-check-text" class="amb-text"></span>
            </p>

            <!-- interviewer details (d): the follow-ups already asked, how fresh the answer is, what the step's
                 maps still miss, where n / Enter goes -->
            <div class="debug card-debug">
              <div id="followups" class="followups">
                <div class="block-label sub" data-i18n="focus.followups"></div>
                <ol id="thread" class="thread"></ol>
              </div>
              <p id="summary-meta" class="summary-meta"></p>
              <p id="phase-gaps" class="phase-gaps"></p>
              <div class="move-hint" id="move-hint"></div>
            </div>

            <!-- the interviewer's controls: discreet (same endpoints and keys as the console) -->
            <div class="controls" id="controls">
              <button data-action="next" class="ctl primary-ctl" data-i18n-attr="title:controls.nextTitle"><span data-i18n="controls.next"></span><kbd>n</kbd></button>
              <button data-action="answered" class="ctl" data-i18n-attr="title:controls.answeredTitle"><span data-i18n="controls.answered"></span><kbd>a</kbd></button>
              <button data-action="skip" class="ctl" id="ctl-skip" data-i18n-attr="title:controls.skipTitle"><span data-i18n="controls.skip"></span><kbd>k</kbd></button>
              <button data-action="phase" class="ctl" data-i18n-attr="title:controls.nextPhaseTitle"><span data-i18n="controls.nextPhase"></span><kbd>p</kbd></button>
              <button data-action="sync" class="ctl" data-i18n-attr="title:controls.syncTitle"><span data-i18n="controls.sync"></span><kbd>s</kbd></button>
              <button data-action="end" class="ctl end-ctl" id="ctl-end" data-i18n-attr="title:controls.endTitle"><span data-i18n="controls.end"></span><kbd>e</kbd></button>
            </div>
          </div>
        </article>

        <div class="upcoming">
          <div class="label small-label"><span data-i18n="focus.next"></span><span id="where-line" class="where-line debug"></span></div>
          <ol id="next" class="next"></ol>
        </div>
        <div class="interview-end" aria-hidden="true"></div>
      </section>
      <button id="jump" class="jump hidden" data-i18n="focus.jump"></button>

      <aside class="side">
        <!-- what the interviewee may see: time left, coverage, and the steps of the conversation -->
        <div class="where">
          <div class="label small-label" data-i18n="where.title"></div>
          <div class="where-row">
            <div class="big-num"><span id="time-left">20:00</span><small id="time-total"></small></div>
            <div class="big-num"><span id="coverage-pct">0 %</span><small data-i18n="where.coverage"></small></div>
          </div>
          <div class="label small-label phases-title" data-i18n="phases.title"></div>
          <ol id="phases" class="phases"></ol>
        </div>
        <!-- interviewer details (d): who is in the meeting, timings, priorities, the maps, coverage by theme -->
        <div class="debug side-debug">
          <div class="debug-title" data-i18n="details.title"></div>
          <!-- who we interview: their role and persona (personas.py), picked on the consent screen -->
          <div id="who-chip" class="who-chip hidden"></div>
          <div id="latency" class="latency" title=""></div>
          <div class="must" id="must"></div>
          <div id="maps-line" class="maps-line"></div>
          <div class="debug-sub" data-i18n="details.themes"></div>
          <ul id="themes" class="themes"></ul>
        </div>
      </aside>
    </main>

    <!-- the live transcript: interviewer detail, hidden by default (d for every detail, t for this one alone) -->
    <footer class="live hidden" id="live-wrap">
      <div class="live-label"><span class="rec"></span><span data-i18n="live.title"></span>
        <span id="noise" class="noise"></span></div>
      <div class="tail" id="tail" aria-live="off"></div>
    </footer>
  </div>

  <!-- consent screen, shown before capture starts -->
  <div id="consent" class="overlay">
    <div class="card">
      <h2 id="consent-client"></h2>
      <p id="consent-primary" class="consent-primary"></p>
      <!-- who is in the meeting (the client sheet's people, set in the admin) and their personas -->
      <div class="consent-who" id="consent-who">
        <div class="ls-title" data-i18n="consent.interviewee"></div>
        <ul id="who-list" class="who-list"></ul>
        <p id="who-why" class="muted small"></p>
      </div>
      <div class="consent-langs">
        <div class="ls-title" data-i18n="consent.languages"></div>
        <language-select id="consent-interview" label="consent.interview" allow-other></language-select>
        <language-select id="consent-speech" label="consent.speech" multiple></language-select>
        <p class="ls-hint muted small" data-i18n="consent.speechHint"></p>
        <language-select id="consent-ui" bind="ui" segmented label="consent.ui"></language-select>
      </div>
      <button id="start" class="primary" data-i18n="consent.start"></button>
      <p id="consent-progress" class="muted small"></p>
      <p id="consent-error" class="error"></p>
      <p class="admin-link"><a href="/admin" target="_blank" data-i18n="consent.admin"></a></p>
    </div>
  </div>

  <!-- end-of-interview banner -->
  <div id="banner" class="overlay banner hidden">
    <div class="card">
      <p id="banner-primary" class="banner-primary"></p>
      <p id="banner-status" class="muted"></p>
      <p id="banner-links" class="links"></p>
      <p id="banner-paths" class="paths"></p>
    </div>
  </div>

  <!-- interviewer console: press "c" (or click the corner) -->
  <button id="console-toggle" class="console-toggle" data-i18n-attr="title:app.console;aria-label:app.console">⋯</button>
  <div id="console" class="console hidden">
    <div class="console-row status" id="console-status"></div>
    <div class="console-row">
      <button data-action="next" title="n / Enter"><span data-i18n="console.next"></span> <kbd>n</kbd></button>
      <button data-action="answered" title="a"><span data-i18n="console.answered"></span> <kbd>a</kbd></button>
      <button data-action="skip" title="k"><span data-i18n="console.skip"></span> <kbd>k</kbd></button>
      <button data-action="phase" title="p"><span data-i18n="console.nextPhase"></span> <kbd>p</kbd></button>
      <button data-action="sync" title="s"><span data-i18n="console.sync"></span> <kbd>s</kbd></button>
    </div>
    <div class="console-row">
      <button data-action="enough" data-i18n="console.enough"></button>
      <button data-action="finalize" class="primary" data-i18n="console.finalize"></button>
    </div>
    <div class="console-row langs-row">
      <span class="ls-title" data-i18n="console.languages"></span>
      <language-select id="console-interview" label="lang.interview" allow-other></language-select>
      <language-select id="console-speech" label="lang.speech" multiple disabled></language-select>
      <span id="translation-status" class="muted small"></span>
    </div>
    <div class="console-row">
      <label for="wispr" data-i18n="console.wisprLabel"></label>
      <textarea id="wispr" rows="5" data-i18n-attr="placeholder:console.wisprPlaceholder"></textarea>
      <button data-action="wispr" data-i18n="console.wisprMerge"></button>
      <span id="wispr-status" class="muted"></span>
    </div>
    <!-- who is in the meeting, with each one's persona and prep note (interviewer only, never in the plan) -->
    <div class="console-row recipes hidden" id="console-attendees">
      <span class="ls-title" data-i18n="console.attendees"></span>
      <ul id="console-attendee-list" class="recipe-list attendee-list"></ul>
      <p class="muted small" data-i18n="console.attendeesNote"></p>
    </div>
    <!-- the views heard on AI, grouped by statement, not by person (interviewer only, never in the plan) -->
    <div class="console-row recipes hidden" id="console-viewpoints">
      <span class="ls-title" data-i18n="console.viewpoints"></span>
      <ul id="console-viewpoint-list" class="recipe-list viewpoint-list"></ul>
      <p class="muted small" id="console-speakers"></p>
      <p class="muted small" data-i18n="console.viewpointsNote"></p>
    </div>
    <!-- possible recipes: library recipes the interview fits so far (interviewer only, never the question card) -->
    <div class="console-row recipes hidden" id="console-recipes">
      <span class="ls-title" data-i18n="console.recipes"></span>
      <ul id="console-recipe-list" class="recipe-list"></ul>
    </div>
    <!-- potential ambassadors heard so far (interviewer only) -->
    <div class="console-row recipes hidden" id="console-ambassadors">
      <span class="ls-title" data-i18n="console.ambassadors"></span>
      <ul id="console-ambassador-list" class="recipe-list"></ul>
    </div>
    <!-- the people questions per workflow, with why they are asked, and how to ask this interviewee (interviewer only) -->
    <div class="console-row recipes hidden" id="console-probes">
      <span class="ls-title" data-i18n="console.probes"></span>
      <p id="console-read" class="muted small hidden"></p>
      <ul id="console-probe-list" class="recipe-list"></ul>
    </div>
    <!-- the talking points per workflow: the decision the person moves up to and why now (interviewer only) -->
    <div class="console-row recipes hidden" id="console-framings">
      <span class="ls-title" data-i18n="console.framings"></span>
      <ul id="console-framing-list" class="recipe-list"></ul>
    </div>
    <!-- what the interviewee could not answer, and who would know (goes to the plan) -->
    <div class="console-row recipes hidden" id="console-to-check">
      <span class="ls-title" data-i18n="console.toCheck"></span>
      <ul id="console-to-check-list" class="recipe-list"></ul>
    </div>
    <div class="console-row links" id="console-links"></div>
    <div class="console-row paths" id="console-paths"></div>
    <div class="console-row"><a href="/admin" target="_blank" class="admin-link" data-i18n="console.admin"></a></div>
    <div class="console-row muted small" data-i18n="console.keys"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
